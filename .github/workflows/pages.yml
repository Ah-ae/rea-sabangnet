name: Deploy demo to GitHub Pages

# 정적 데모(docs/)를 빌드해 GitHub Pages 로 배포한다.
# 주의: private 레포에서 Pages 를 쓰려면 GitHub Pro 이상 플랜이 필요하다.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web-demo/**"
      - "app/globals.css"
      - "scripts/build-demo.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
